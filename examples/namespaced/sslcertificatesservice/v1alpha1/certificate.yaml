apiVersion: sslcertificatesservice.alibabacloud.m.crossplane.io/v1alpha1
kind: Certificate
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: sslcertificatesservice/v1alpha1/certificate
  labels:
    testing.upbound.io/example-name: certificate
  name: example-certificate
spec:
  forProvider:
    # CAS stores certificates centrally in cn-hangzhou regardless of where
    # this resource is configured; common.AlbCertificateIdExtractor() needs
    # this to be the CAS home region to build an id ALB will accept.
    region: cn-hangzhou
    certificateName: example-certificate
    # Both the certificate body and the private key are supplied via Secrets.
    certSecretRef:
      key: cert
      name: example-certificate-cert
    keySecretRef:
      key: key
      name: example-certificate-key
