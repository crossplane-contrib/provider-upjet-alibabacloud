apiVersion: polardb.alibabacloud.m.crossplane.io/v1alpha1
kind: Endpoint
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: polardb/v1alpha1/endpoint
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    dbClusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    endpointType: Custom

---

apiVersion: polardb.alibabacloud.m.crossplane.io/v1alpha1
kind: Cluster
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: polardb/v1alpha1/endpoint
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    dbNodeClass: polar.mysql.x4.medium
    dbType: MySQL
    dbVersion: "8.0"
    description: crossplane-example
    payType: PostPaid
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: VPC
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: polardb/v1alpha1/endpoint
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 172.16.0.0/16
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: polardb/v1alpha1/endpoint
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 172.16.0.0/24
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: crossplane-example
    zoneId: us-west-1a
