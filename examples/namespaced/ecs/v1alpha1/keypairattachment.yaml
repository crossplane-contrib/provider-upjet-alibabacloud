apiVersion: ecs.alibabacloud.m.crossplane.io/v1alpha1
kind: KeyPairAttachment
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/keypairattachment
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    region: us-west-1
    instanceRefs:
    - name: keypairattach
    keyPairNameSelector:
      matchLabels:
        testing.upbound.io/example-name: keypairattach

---

apiVersion: ecs.alibabacloud.m.crossplane.io/v1alpha1
kind: KeyPair
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/keypairattachment
  labels:
    testing.upbound.io/example-name: keypairattach
  name: keypairattach
spec:
  forProvider:
    region: us-west-1
    keyPairName: crossplane-example-for-attachment

---

apiVersion: ecs.alibabacloud.m.crossplane.io/v1alpha1
kind: Instance
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/keypairattachment
  labels:
    testing.upbound.io/example-name: keypairattach
  name: keypairattach
spec:
  forProvider:
    region: us-west-1
    availabilityZone: us-west-1a
    imageId: ubuntu_22_04_x64_20G_alibase_20260522.vhd
    instanceName: crossplane-example
    instanceType: ecs.g9i.large
    systemDiskCategory: cloud_essd
    internetChargeType: PayByBandwidth
    securityGroupRefs:
    - name: keypairattach
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: keypairattach

---

apiVersion: ecs.alibabacloud.m.crossplane.io/v1alpha1
kind: SecurityGroup
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/keypairattachment
  labels:
    testing.upbound.io/example-name: keypairattach
  name: keypairattach
spec:
  forProvider:
    region: us-west-1
    securityGroupName: crossplane-example
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: keypairattach

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: VPC
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/keypairattachment
  labels:
    testing.upbound.io/example-name: keypairattach
  name: keypairattach
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 172.17.3.0/24
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/keypairattachment
  labels:
    testing.upbound.io/example-name: keypairattach
  name: keypairattach
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 172.17.3.0/24
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: keypairattach
    vswitchName: crossplane-example
    zoneId: us-west-1a
