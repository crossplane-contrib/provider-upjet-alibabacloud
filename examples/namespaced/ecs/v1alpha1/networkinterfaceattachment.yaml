apiVersion: ecs.alibabacloud.m.crossplane.io/v1alpha1
kind: NetworkInterfaceAttachment
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/networkinterfaceattachment
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: eniattach
    networkInterfaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: eniattach

---

apiVersion: ecs.alibabacloud.m.crossplane.io/v1alpha1
kind: NetworkInterface
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/networkinterfaceattachment
  labels:
    testing.upbound.io/example-name: eniattach
  name: eniattach
spec:
  forProvider:
    region: us-west-1
    description: Basic example
    networkInterfaceName: crossplane-example
    primaryIpAddress: 192.168.0.3
#    resourceGroupId: ${data.alicloud_resource_manager_resource_groups.default.ids.0}
    securityGroupRefs:
    - name: eniattach
    tags:
      Created: TF
      For: example
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: eniattach

---

apiVersion: ecs.alibabacloud.m.crossplane.io/v1alpha1
kind: Instance
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/networkinterfaceattachment
  labels:
    testing.upbound.io/example-name: eniattach
  name: eniattach
spec:
  forProvider:
    region: us-west-1
    availabilityZone: us-west-1a
    hostName: crossplane-example
    imageId: ubuntu_22_04_x64_20G_alibase_20260522.vhd
    instanceName: crossplane-example
    instanceType: ecs.g9i.large
    systemDiskCategory: cloud_essd
    securityGroupRefs:
    - name: eniattach
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: eniattach

---

apiVersion: ecs.alibabacloud.m.crossplane.io/v1alpha1
kind: SecurityGroup
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/networkinterfaceattachment
  labels:
    testing.upbound.io/example-name: eniattach
  name: eniattach
spec:
  forProvider:
    region: us-west-1
    description: New security group
    securityGroupName: crossplane-example
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: eniattach

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: VPC
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/networkinterfaceattachment
  labels:
    testing.upbound.io/example-name: eniattach
  name: eniattach
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 192.168.0.0/16
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: ecs/v1alpha1/networkinterfaceattachment
  labels:
    testing.upbound.io/example-name: eniattach
  name: eniattach
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 192.168.0.0/24
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: eniattach
    vswitchName: crossplane-example
    zoneId: us-west-1a
