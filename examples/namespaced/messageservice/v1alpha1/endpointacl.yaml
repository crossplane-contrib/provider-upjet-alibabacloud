apiVersion: messageservice.alibabacloud.m.crossplane.io/v1alpha1
kind: EndpointAcl
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: messageservice/v1alpha1/endpointacl
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    aclStrategy: allow
    cidr: 192.168.1.1/23
    endpointTypeSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: messageservice.alibabacloud.m.crossplane.io/v1alpha1
kind: Endpoint
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: messageservice/v1alpha1/endpointacl
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    endpointEnabled: true
    endpointType: public
