apiVersion: rds.alibabacloud.m.crossplane.io/v1alpha1
kind: DBProxy
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxy
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    instanceNetworkType: VPC
    dbProxyInstanceNum: 2
    dbProxyConnectionPrefix: crossplaneexample
    dbProxyConnectStringPort: 3306
    dbProxyEndpointReadWriteMode: ReadWrite
    readOnlyInstanceMaxDelayTime: 90
    dbProxyFeatures: "TransactionReadSqlRouteOptimizeStatus:1;ConnectionPersist:1;ReadWriteSpliting:1"
    # Standard automatically allocates read weight across the instance and its
    # read-only replicas, so no explicit read_only_instance_weight is required.
    readOnlyInstanceDistributionType: Standard
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: rds.alibabacloud.m.crossplane.io/v1alpha1
kind: ReadonlyInstance
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxy
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    instanceName: crossplane-example-readonly
    engineVersionSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    instanceStorage: 20
    # A read-only instance takes a read-only class: the primary's
    # mysql.n2.medium.2c is rejected with InvalidSaleComponentFault. This one is
    # High-availability with cloud disks, matching the primary.
    instanceType: mysqlro.n2.small.1c
    dbInstanceStorageType: cloud_essd
    zoneIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    masterDbInstanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: rds.alibabacloud.m.crossplane.io/v1alpha1
kind: Instance
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxy
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    engine: MySQL
    engineVersion: "8.0"
    # The dedicated proxy is not offered on Basic Edition, so this primary must
    # be High-availability. HA classes use the "2c" suffix (mysql.n2.medium.2c)
    # where Basic uses "1"; confirmed via aliyun rds DescribeAvailableClasses.
    category: HighAvailability
    dbInstanceStorageType: cloud_essd
    instanceChargeType: Postpaid
    instanceName: crossplane-example
    instanceStorage: 20
    instanceType: mysql.n2.medium.2c
    # The proxy runs in the instance's zone, and cn-beijing-l ran out of proxy
    # capacity (InsufficientResourceCapacity from ModifyDBProxy, runs
    # 39972692670 and 40065480312). DescribeAvailableZones offers MySQL 8.0 HA on
    # cloud ESSD only in cn-beijing-f, i and l.
    zoneId: cn-beijing-i
    securityIps:
      - 10.0.0.0/8
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: VPC
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxy
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/16
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxy
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/24
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: crossplane-example
    zoneId: cn-beijing-i
