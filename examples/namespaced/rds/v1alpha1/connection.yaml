apiVersion: rds.alibabacloud.m.crossplane.io/v1alpha1
kind: Connection
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/connection
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    connectionPrefix: crossplaneexample
    port: "3306"
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: rds.alibabacloud.m.crossplane.io/v1alpha1
kind: Instance
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/connection
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    engine: MySQL
    engineVersion: "8.0"
    category: Basic
    dbInstanceStorageType: cloud_essd
    instanceChargeType: Postpaid
    instanceName: crossplane-example
    instanceStorage: 20
    instanceType: mysql.n2.medium.1
    zoneId: cn-beijing-l
    securityIps:
      - 10.0.0.0/8
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: VPC
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/connection
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/16
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/connection
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/24
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: crossplane-example
    zoneId: cn-beijing-l
