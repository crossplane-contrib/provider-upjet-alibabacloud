apiVersion: oss.alibabacloud.m.crossplane.io/v1alpha1
kind: BucketPolicy
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/bucketpolicy
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: bucketpolicy
    policy: '{"Version":"1","Statement":[{"Action":["oss:PutObject","oss:GetObject"],"Effect":"Deny","Principal":["1234567890"],"Resource":["acs:oss:*:1234567890:*/*"]}]}'

---

apiVersion: oss.alibabacloud.m.crossplane.io/v1alpha1
kind: Bucket
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/bucketpolicy
  labels:
    testing.upbound.io/example-name: bucketpolicy
  name: bucketpolicy
spec:
  forProvider:
    region: us-west-1
    bucket: crossplane-example-bucketpolicy-202504081600
    storageClass: Standard
