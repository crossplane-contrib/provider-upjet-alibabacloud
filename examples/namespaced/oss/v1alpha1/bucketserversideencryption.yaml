apiVersion: oss.alibabacloud.m.crossplane.io/v1alpha1
kind: BucketServerSideEncryption
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/bucketserversideencryption
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: CreateBucket
    kmsDataEncryption: SM4
    kmsMasterKeyIdSelector:
      matchLabels:
        testing.upbound.io/example-name: bucketserversideencryption
    sseAlgorithm: KMS

---

apiVersion: oss.alibabacloud.m.crossplane.io/v1alpha1
kind: Bucket
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/bucketserversideencryption
  labels:
    testing.upbound.io/example-name: CreateBucket
  name: createbucket
spec:
  forProvider:
    region: us-west-1
    bucket: crossplane-example-bucketserversideencryption-202504081600
    storageClass: Standard

---

apiVersion: kms.alibabacloud.m.crossplane.io/v1alpha1
kind: Key
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/bucketserversideencryption
  labels:
    testing.upbound.io/example-name: bucketserversideencryption
  name: bucketserversideencryption
spec:
  forProvider:
    region: us-west-1
    description: OSS server-side encryption example
    pendingWindowInDays: 7
    status: Enabled
