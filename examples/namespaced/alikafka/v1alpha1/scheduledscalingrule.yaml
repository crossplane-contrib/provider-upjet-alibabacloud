apiVersion: alikafka.alibabacloud.m.crossplane.io/v1alpha1
kind: ScheduledScalingRule
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    ruleName: crossplane-example-scaling-rule
    scheduleType: repeat
    repeatType: Weekly
    weeklyTypes:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
    durationMinutes: 100
    # 2030-01-07T10:00:00 GMT+8, must stay in the future
    firstScheduledTime: 1893981600000
    reservedPubFlow: 200
    reservedSubFlow: 200
    timeZone: GMT+8
    enable: false
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: serverless

---

apiVersion: alikafka.alibabacloud.m.crossplane.io/v1alpha1
kind: Instance
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: serverless
  name: serverless
spec:
  forProvider:
    region: cn-beijing
    deployType: 4
    instanceType: alikafka_serverless
    specType: normal
    serviceVersion: 3.3.1
    config: '{"enable.acl":"true"}'
    serverlessConfig:
      - reservedPublishCapacity: 60
        reservedSubscribeCapacity: 60
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    securityGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: ecs.alibabacloud.m.crossplane.io/v1alpha1
kind: SecurityGroup
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: VPC
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    vpcName: crossplane-example-for-alikafka
    cidrBlock: 172.16.0.0/12

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  namespace: default
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    vswitchName: crossplane-example-for-alikafka
    cidrBlock: 172.16.0.0/24
    zoneId: cn-beijing-h
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
