apiVersion: ram.alibabacloud.crossplane.io/v1alpha1
kind: PasswordPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: ram/v1alpha1/passwordpolicy
    # Kept out of automated e2e runs: this sets the password policy of the whole
    # account (SetPasswordPolicy), and upstream's delete is a no-op, so deleting
    # the resource leaves the policy below in place for every RAM user.
    upjet.upbound.io/manual-intervention: "This changes the account-wide RAM password policy, and delete does not revert it"
  labels:
    testing.upbound.io/example-name: test-password-policy-1
  name: test-password-policy-1
spec:
  forProvider:
    hardExpiry: false
    maxLoginAttemps: 1
    maxPasswordAge: 0
    minimumPasswordDifferentCharacter: 1
    minimumPasswordLength: 8
    passwordNotContainUserName: false
    passwordReusePrevention: 1
    requireLowercaseCharacters: false
    requireNumbers: false
    requireSymbols: false
    requireUppercaseCharacters: false
