apiVersion: privatelink.alibabacloud.crossplane.io/v1alpha1
kind: VpcEndpointConnection
metadata:
  annotations:
    meta.upbound.io/example-id: privatelink/v1alpha1/vpcendpointconnection
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    region: us-west-1
    bandwidth: 1024
    endpointIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-for-connection
    serviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-for-connection

---

apiVersion: privatelink.alibabacloud.crossplane.io/v1alpha1
kind: VpcEndpoint
metadata:
  annotations:
    meta.upbound.io/example-id: privatelink/v1alpha1/vpcendpointconnection
  labels:
    testing.upbound.io/example-name: example-for-connection
  name: example-for-connection
spec:
  forProvider:
    region: us-west-1
    securityGroupRefs:
    - name: example-for-connection
    serviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-for-connection
    vpcEndpointName: crossplane-example
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-for-connection

---

apiVersion: privatelink.alibabacloud.crossplane.io/v1alpha1
kind: VPCEndpointService
metadata:
  annotations:
    meta.upbound.io/example-id: privatelink/v1alpha1/vpcendpointconnection
  labels:
    testing.upbound.io/example-name: example-for-connection
  name: example-for-connection
spec:
  forProvider:
    region: us-west-1
    # The connection resource accepts the endpoint's connection, so the
    # service must not accept it on its own. Like upstream's acceptance test,
    # the service needs no load balancer for that.
    autoAcceptConnection: false
    connectBandwidth: 103
    serviceDescription: crossplane-example

---

apiVersion: ecs.alibabacloud.crossplane.io/v1alpha1
kind: SecurityGroup
metadata:
  annotations:
    meta.upbound.io/example-id: privatelink/v1alpha1/vpcendpointconnection
  labels:
    testing.upbound.io/example-name: example-for-connection
  name: example-for-connection
spec:
  forProvider:
    region: us-west-1
    securityGroupName: crossplane-example
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-for-connection

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: privatelink/v1alpha1/vpcendpointconnection
  labels:
    testing.upbound.io/example-name: example-for-connection
  name: example-for-connection
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 10.0.0.0/8
    vpcName: crossplane-example
