apiVersion: alikafka.alibabacloud.crossplane.io/v1alpha1
kind: Topic
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/topic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    topic: crossplane-example-topic
    remark: topic-remark
    partitionNum: 12
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    tags:
      Created: Crossplane
      For: example

---

apiVersion: alikafka.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    # Kafka children cannot be deleted once this Instance is released, and
    # uptest deletes everything concurrently, so they go first explicitly.
    uptest.upbound.io/pre-delete-hook: testhooks/delete-children.sh
    meta.upbound.io/example-id: alikafka/v1alpha1/topic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    name: crossplane-example-for-alikafka
    config: '{"enable.acl":"true"}'
    partitionNum: 50
    diskType: 1
    diskSize: 500
    deployType: 5
    ioMax: 20
    specType: professional
    serviceVersion: 2.2.0
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    securityGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: ecs.alibabacloud.crossplane.io/v1alpha1
kind: SecurityGroup
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/topic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/topic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    vpcName: crossplane-example-for-alikafka
    cidrBlock: 172.16.0.0/12

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/topic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    vswitchName: crossplane-example-for-alikafka
    cidrBlock: 172.16.0.0/24
    zoneId: us-west-1a
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
