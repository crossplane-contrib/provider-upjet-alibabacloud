apiVersion: alikafka.alibabacloud.crossplane.io/v1alpha1
kind: ScheduledScalingRule
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: scheduledscalingrule
  name: scheduledscalingrule
spec:
  forProvider:
    region: cn-beijing
    ruleName: crossplane-example-scaling-rule
    scheduleType: repeat
    repeatType: Weekly
    weeklyTypes:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
    durationMinutes: 100
    firstScheduledTime: 1769578000000
    reservedPubFlow: 200
    reservedSubFlow: 200
    timeZone: GMT+8
    enable: false
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: scheduledscalingrule

---

apiVersion: alikafka.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: scheduledscalingrule
  name: scheduledscalingrule
spec:
  forProvider:
    region: cn-beijing
    deployType: 4
    instanceType: alikafka_serverless
    specType: normal
    serviceVersion: 3.3.1
    config: '{"enable.acl":"true"}'
    serverlessConfig:
      - reservedPublishCapacity: 60
        reservedSubscribeCapacity: 60
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: scheduledscalingrule
    securityGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: scheduledscalingrule

---

apiVersion: ecs.alibabacloud.crossplane.io/v1alpha1
kind: SecurityGroup
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: scheduledscalingrule
  name: scheduledscalingrule
spec:
  forProvider:
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: scheduledscalingrule

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: scheduledscalingrule
  name: scheduledscalingrule
spec:
  forProvider:
    region: cn-beijing
    vpcName: crossplane-example-for-alikafka-scalingrule
    cidrBlock: 10.4.0.0/16

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/scheduledscalingrule
  labels:
    testing.upbound.io/example-name: scheduledscalingrule
  name: scheduledscalingrule
spec:
  forProvider:
    region: cn-beijing
    vswitchName: crossplane-example-for-alikafka-scalingrule
    cidrBlock: 10.4.0.0/24
    zoneId: cn-beijing-h
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: scheduledscalingrule
