apiVersion: alikafka.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    name: crossplane-example-for-alikafka
    config: '{"enable.acl":"true"}'
    partitionNum: 50
    diskType: 1
    diskSize: 500
    deployType: 5
    ioMax: 20
    specType: professional
    serviceVersion: 2.2.0
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    securityGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: ecs.alibabacloud.crossplane.io/v1alpha1
kind: SecurityGroup
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    vpcName: crossplane-example-for-alikafka
    cidrBlock: 172.16.0.0/12

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    vswitchName: crossplane-example-for-alikafka
    cidrBlock: 172.16.0.0/24
    zoneId: cn-beijing-h
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
