apiVersion: oos.alibabacloud.crossplane.io/v1alpha1
kind: ApplicationGroup
metadata:
  annotations:
    meta.upbound.io/example-id: oos/v1alpha1/applicationgroup
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    applicationGroupName: crossplane-example-appgroup
    applicationNameSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    deployRegionId: cn-beijing
    description: crossplane-example-appgroup
    importTagKey: example_key
    importTagValue: example_value
    region: cn-beijing

---

apiVersion: oos.alibabacloud.crossplane.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: oos/v1alpha1/applicationgroup
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    applicationName: crossplane-example-application
    description: crossplane-example-application
    region: cn-beijing
    tags:
      Created: TF
