apiVersion: oss.alibabacloud.crossplane.io/v1alpha1
kind: BucketCname
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/bucketcname
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: bucketcname
    domain: tftestacc.com

---

apiVersion: alidns.alibabacloud.crossplane.io/v1alpha1
kind: Record
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/bucketcname
  labels:
    testing.upbound.io/example-name: bucketcname
  name: bucketcname
spec:
  forProvider:
    domainName: tftestacc.com
    line: default
    priority: 1
    rr: _dnsauth
    status: ENABLE
    ttl: 600
    type: TXT
    # The real verification value comes from the sibling BucketCnameToken's
    # status.atProvider.token, which alicloud_alidns_record's "value" field
    # has no generated reference/selector for. A placeholder is used here
    # since the actual value only matters for live domain ownership
    # verification with Alibaba Cloud, not for exercising the Record CRD.
    value: crossplane-example-placeholder-token

---

apiVersion: oss.alibabacloud.crossplane.io/v1alpha1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/bucketcname
  labels:
    testing.upbound.io/example-name: bucketcname
  name: bucketcname
spec:
  forProvider:
    region: us-west-1
    bucket: crossplane-example-bucketcname-202504081600
    storageClass: Standard

---

apiVersion: oss.alibabacloud.crossplane.io/v1alpha1
kind: BucketCnameToken
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/bucketcname
  labels:
    testing.upbound.io/example-name: bucketcname
  name: bucketcname
spec:
  forProvider:
    region: us-west-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: bucketcname
    domain: tftestacc.com
