apiVersion: kms.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: kms/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: us-west-1
    bindVpcs:
    - regionId: us-west-1
      vpcIdSelector:
        matchLabels:
          testing.upbound.io/example-name: shareVPC
      vswitchIdSelector:
        matchLabels:
          testing.upbound.io/example-name: shareVswitch
    - regionId: us-west-1
      vpcIdSelector:
        matchLabels:
          testing.upbound.io/example-name: share-VPC2
      vswitchIdSelector:
        matchLabels:
          testing.upbound.io/example-name: share-vswitch2
    - regionId: us-west-1
      vpcIdSelector:
        matchLabels:
          testing.upbound.io/example-name: share-VPC3
      vswitchIdSelector:
        matchLabels:
          testing.upbound.io/example-name: share-vsw3
    keyNum: 1000
    log: "0"
    logStorage: 0
    paymentType: Subscription
    period: 1
    productVersion: "3"
    renewPeriod: 3
    renewStatus: ManualRenewal
    secretNum: 0
    spec: 1000
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vpc-amp-instance-example
    vpcNum: 7
    vswitchIdsRefs:
    - name: vswitch-j
    - name: vswitch
    zoneIds:
    - us-west-1a
    - us-west-1b

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: kms/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: share-VPC2
  name: share-vpc2
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 172.16.0.0/12
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: kms/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: share-VPC3
  name: share-vpc3
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 172.16.0.0/12
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: kms/v1alpha1/instance
  labels:
    testing.upbound.io/example-name: shareVPC
  name: sharevpc
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 172.16.0.0/12
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: kms/v1alpha1/instance
  labels:
