apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: DBProxyPublic
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxypublic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    connectionStringPrefix: crossplaneexamplepub
    dbProxyConnectionStringNetType: Public
    dbProxyNewConnectStringPort: "3306"
    dbInstanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    dbProxyEndpointIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: DBProxy
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxypublic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    instanceNetworkType: VPC
    dbProxyInstanceNum: 2
    dbProxyConnectionPrefix: crossplaneexample
    dbProxyConnectStringPort: 3306
    dbProxyEndpointReadWriteMode: ReadWrite
    readOnlyInstanceMaxDelayTime: 90
    dbProxyFeatures: "TransactionReadSqlRouteOptimizeStatus:1;ConnectionPersist:1;ReadWriteSpliting:1"
    readOnlyInstanceDistributionType: Standard
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: ReadonlyInstance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxypublic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    instanceName: crossplane-example-readonly
    engineVersionSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    instanceStorageSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    instanceTypeSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    zoneIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    masterDbInstanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxypublic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    engine: MySQL
    engineVersion: "8.0"
    category: HighAvailability
    dbInstanceStorageType: cloud_essd
    instanceChargeType: Postpaid
    instanceName: crossplane-example
    instanceStorage: 20
    instanceType: mysql.n2.medium.1c
    zoneId: cn-beijing-l
    securityIps:
      - 10.0.0.0/8
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxypublic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/16
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/dbproxypublic
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/24
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: crossplane-example
    zoneId: cn-beijing-l
