apiVersion: oos.alibabacloud.crossplane.io/v1alpha1
kind: PatchBaseline
metadata:
  annotations:
    meta.upbound.io/example-id: oos/v1alpha1/patchbaseline
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    approvalRules: '{"PatchRules":[{"EnableNonSecurity":true,"PatchFilterGroup":[{"Key":"PatchSet","Values":["OS"]},{"Key":"ProductFamily","Values":["Windows"]},{"Key":"Product","Values":["*"]},{"Key":"Classification","Values":["Security Updates","Critical Updates"]},{"Key":"Severity","Values":["Critical","Important"]}],"ApproveAfterDays":7,"ComplianceLevel":"Unspecified"}]}'
    operationSystem: Windows
    patchBaselineName: crossplane-example-patchbaseline
    region: us-west-1
