apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: ReadWriteSplittingConnection
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readwritesplittingconnection
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    connectionPrefix: crossplaneexamplerw
    # Standard automatically distributes read weight across the instance and
    # its read-only replicas, so no explicit weight map is required.
    distributionType: Standard
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: ReadonlyInstance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readwritesplittingconnection
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    instanceName: crossplane-example-readonly
    engineVersionSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    instanceStorage: 20
    # Unverified: the primary's class is rejected here with
    # InvalidSaleComponentFault (run 40774653778). A read-only instance needs a
    # read-only class, which ListClasses (CommodityCode rords) lists only for
    # an existing primary. This example is left out of uptest until that class
    # is known.
    instanceType: mysql.x2.medium.2
    dbInstanceStorageType: local_ssd
    zoneIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    masterDbInstanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readwritesplittingconnection
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    engine: MySQL
    # The read/write splitting address is offered only on MySQL 5.6, and on
    # MySQL 5.7 High-availability with local SSDs; MySQL 8.0 on cloud disks
    # fails with OperationDenied.DBType (run 39993486952). Read-only instances
    # also need a High-availability primary. mysql.x2.medium.2 is the smallest
    # class DescribeAvailableClasses offers for this setup in cn-beijing.
    engineVersion: "5.7"
    category: HighAvailability
    dbInstanceStorageType: local_ssd
    instanceChargeType: Postpaid
    instanceName: crossplane-example
    instanceStorage: 20
    instanceType: mysql.x2.medium.2
    zoneId: cn-beijing-i
    securityIps:
      - 10.0.0.0/8
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readwritesplittingconnection
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/16
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readwritesplittingconnection
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/24
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: crossplane-example
    zoneId: cn-beijing-i
