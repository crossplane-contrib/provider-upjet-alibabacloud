apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: ReadonlyInstance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readonlyinstance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    instanceName: crossplane-example-readonly
    # These mirror the master instance so the read-only replica matches it.
    engineVersionSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    instanceStorage: 20
    # A read-only instance takes a read-only class: the primary's
    # mysql.n2.medium.2c is rejected with InvalidSaleComponentFault. This one is
    # High-availability with cloud disks, matching the primary.
    instanceType: mysqlro.n2.small.1c
    dbInstanceStorageType: cloud_essd
    zoneIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    masterDbInstanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readonlyinstance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    engine: MySQL
    engineVersion: "8.0"
    # Read-only instances require a High-availability primary, so this one is
    # not Basic like the other RDS examples. HA classes use the "2c" suffix
    # (mysql.n2.medium.2c); confirmed via aliyun rds DescribeAvailableClasses.
    category: HighAvailability
    dbInstanceStorageType: cloud_essd
    instanceChargeType: Postpaid
    instanceName: crossplane-example
    instanceStorage: 20
    instanceType: mysql.n2.medium.2c
    zoneId: cn-beijing-l
    securityIps:
      - 10.0.0.0/8
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readonlyinstance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/16
    vpcName: crossplane-example

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readonlyinstance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    cidrBlock: 172.16.0.0/24
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: crossplane-example
    zoneId: cn-beijing-l
