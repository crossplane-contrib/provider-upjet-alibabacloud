# ===========================================================================
# EndpointACLPolicy (alicloud_cr_endpoint_acl_policy) - documentation only
# ===========================================================================
#
# This file intentionally contains NO runnable manifest. EndpointACLPolicy is
# a valid, shipped resource of this provider, but it cannot be exercised by a
# single-provider end-to-end test, so a live example here would always fail to
# become Ready. The "what", the "why no example", and the supported usage are
# documented below.
#
# ---------------------------------------------------------------------------
# What the resource does
# ---------------------------------------------------------------------------
# EndpointACLPolicy adds one IP-whitelist entry (a CIDR) to the access-control
# list of a Container Registry Enterprise Edition (EE) instance endpoint -
# typically the public "internet" endpoint. Its spec.forProvider fields are:
#
#   instanceId    - the EE instance to attach to. Reference an EeInstance via
#                   instanceIdSelector or instanceIdRef (do not hardcode the
#                   generated cri-xxxxx id).
#   endpointType  - the endpoint to guard, e.g. "internet".
#   entry         - the allowed source CIDR, e.g. "192.168.1.0/24".
#   moduleName    - the module the ACL applies to, e.g. "Registry".
#   description   - optional free-text description.
#   region        - the instance's region, e.g. "us-west-1".
#
# ---------------------------------------------------------------------------
# Why there is no runnable example (a provider-only test is not feasible)
# ---------------------------------------------------------------------------
# An ACL entry can only persist once the target endpoint's ACL service is
# ENABLED on the instance. By default the "internet" endpoint is DISABLED:
# the instance reports status.atProvider.instanceEndpoints[].enable = false
# for endpointType "internet".
#
# Enabling it is NOT configurable on the EeInstance resource. The
# instance_endpoints field (which carries the per-endpoint "enable" flag) is
# computed / read-only: in the generated CRD it appears only under
# status.atProvider, never under spec.forProvider, so there is no field to set
# enable = true on the instance.
#
# Upstream (aliyun/terraform-provider-alicloud) exposes endpoint enablement
# ONLY through the side-effecting data source
# "alicloud_cr_endpoint_acl_service" (enable = true), which invokes the
# UpdateInstanceEndpointStatus API. Crossplane / upjet model managed resources
# only and have no representation for a Terraform data source, so there is no
# managed resource - in this provider or upstream - that enables the endpoint
# declaratively.
#
# As a result, if the policy is applied against an instance whose endpoint ACL
# service has not been enabled out-of-band, the create does not persist and the
# Terraform layer surfaces:
#
#   "Provider produced inconsistent result after apply:
#    Root resource was present, but now absent"
#
# and the resource never reaches Ready. A single-provider uptest run creates
# its own fresh EE instance and has no way to enable the endpoint, so a live
# example would always fail. This resource is therefore excluded from the
# automated example list (see UPTEST_EXAMPLE_LIST_CR in the Makefile) and
# shipped as documentation only - it is a test-harness limitation, not a
# defect in the resource.
#
# ---------------------------------------------------------------------------
# Supported usage (declarative) - concrete outline
# ---------------------------------------------------------------------------
# The resource works correctly once the endpoint is enabled. Because enabling
# is only available as a Terraform data source, the declarative pattern pairs
# provider-terraform (to enable) with this provider (to manage the policy).
# The two reconcile independently; the policy create simply retries until the
# endpoint is enabled, so strict ordering is not required (you may still gate
# it - see the note at the end).
#
# Step 1 - enable the endpoint with provider-terraform. A Workspace runs an
# inline module whose data source performs the enable side effect. (Confirm
# the apiVersion of your installed provider-terraform; e.g. tf.upbound.io.)
#
#   apiVersion: tf.upbound.io/v1beta1
#   kind: Workspace
#   metadata:
#     name: enable-cr-internet-endpoint
#   spec:
#     providerConfigRef:
#       name: default
#     forProvider:
#       source: Inline
#       module: |
#         variable "instance_id" { type = string }
#         data "alicloud_cr_endpoint_acl_service" "enable" {
#           instance_id   = var.instance_id
#           endpoint_type = "internet"
#           module_name   = "Registry"
#           enable        = true
#         }
#       vars:
#         - key: instance_id
#           value: cri-xxxxxxxxxxxxxxxx   # the EE instance id
#
# Step 2 - manage the ACL entry with this provider:
#
#   apiVersion: cr.alibabacloud.crossplane.io/v1alpha1
#   kind: EndpointACLPolicy
#   metadata:
#     name: allow-office-cidr
#   spec:
#     forProvider:
#       region: us-west-1
#       instanceIdSelector:
#         matchLabels:
#           example: cr-ee
#       endpointType: internet
#       moduleName: Registry
#       entry: 192.168.1.0/24
#       description: office network
#
# In a Composition, template both resources from the XR in pipeline mode
# (e.g. the function-patch-and-transform function): patch the EE instance id
# into the Workspace var and into the policy's instanceId, and emit them
# together. To enforce enable-before-policy explicitly (rather than relying on
# the policy's retries), gate the policy on the Workspace - e.g. a crossplane
# Usage (of: EndpointACLPolicy, by: Workspace), or derive the policy's
# instanceId from a Workspace output so it is created only after the enable
# step is observed.
#
# Out-of-band alternative: enable the endpoint via the Alibaba Cloud console,
# the aliyun CLI (UpdateInstanceEndpointStatus), or a standalone Terraform run,
# then manage EndpointACLPolicy with this provider as usual.
#
# This file ships a live EeInstance (the policy's prerequisite) so the package
# has a valid manifest to parse, and shows the EndpointACLPolicy commented out
# because it cannot reach Ready until the endpoint is enabled (see above). The
# file is excluded from the automated e2e list (UPTEST_EXAMPLE_LIST_CR); to use
# the policy, enable the endpoint (see the composition outline) and uncomment
# the block below.
# ===========================================================================
---
apiVersion: cr.alibabacloud.crossplane.io/v1alpha1
kind: EeInstance
metadata:
  annotations:
    meta.crossplane.io/example-id: cr-v1alpha1-test-ee-instance-for-acl-1
  labels:
    testing.crossplane.io/example-name: test-ee-instance-for-acl-1
  name: test-ee-instance-for-acl-1
spec:
  forProvider:
    region: us-west-1
    instanceName: cr-ee-test-acl-2
    instanceType: Advanced
    paymentType: Subscription
    period: 1
    renewPeriod: 1
    renewalStatus: AutoRenewal
