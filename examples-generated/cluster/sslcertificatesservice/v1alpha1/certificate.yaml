apiVersion: sslcertificatesservice.alibabacloud.crossplane.io/v1alpha1
kind: Certificate
metadata:
  annotations:
    meta.upbound.io/example-id: sslcertificatesservice/v1alpha1/certificate
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    certSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    certificateName: terraform-example-${random_integer.default.result}
    keySecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    region: cn-beijing
