apiVersion: alikafka.alibabacloud.crossplane.io/v1alpha1
kind: InstanceAllowedIPAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/instanceallowedipattachment
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    allowedIp: 114.237.9.78/32
    allowedType: vpc
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    portRange: 9092/9092
    region: cn-beijing

---

apiVersion: alikafka.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/instanceallowedipattachment
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    deployType: 5
    diskSize: 500
    diskType: 1
    ioMax: 20
    name: ${var.name}-${random_integer.default.result}
    partitionNum: 50
    region: cn-beijing
    securityGroupSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: ecs.alibabacloud.crossplane.io/v1alpha1
kind: SecurityGroup
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/instanceallowedipattachment
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/instanceallowedipattachment
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    cidrBlock: 10.4.0.0/16
    region: cn-beijing
    vpcName: ${var.name}

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: alikafka/v1alpha1/instanceallowedipattachment
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    cidrBlock: 10.4.0.0/24
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: ${var.name}
    zoneId: ${data.alicloud_zones.default.zones.0.id}
