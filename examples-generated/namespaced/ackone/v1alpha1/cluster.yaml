apiVersion: ackone.alibabacloud.m.crossplane.io/v1alpha1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: ackone/v1alpha1/cluster
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    network:
    - vpcIdSelector:
        matchLabels:
          testing.upbound.io/example-name: defaultVpc
      vswitchesRefs:
      - name: defaultyVSwitch
    profile: XFlow
    region: cn-beijing

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: ackone/v1alpha1/cluster
  labels:
    testing.upbound.io/example-name: defaultVpc
  name: defaultvpc
  namespace: upbound-system
spec:
  forProvider:
    cidrBlock: 172.16.0.0/12
    region: cn-beijing
    vpcName: ${var.name}

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: ackone/v1alpha1/cluster
  labels:
    testing.upbound.io/example-name: defaultyVSwitch
  name: defaultyvswitch
  namespace: upbound-system
spec:
  forProvider:
    cidrBlock: 172.16.2.0/24
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: defaultVpc
    vswitchName: ${var.name}
    zoneId: ${data.alicloud_zones.default.zones.0.id}
