apiVersion: sls.alibabacloud.m.crossplane.io/v1alpha1
kind: Store
metadata:
  annotations:
    meta.upbound.io/example-id: sls/v1alpha1/store
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    appendMeta: true
    autoSplit: true
    maxSplitShardCount: 60
    name: example-store
    project: ${alicloud_log_project.example.name}
    region: cn-beijing
    shardCount: 3

---

apiVersion: sls.alibabacloud.m.crossplane.io/v1alpha1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: sls/v1alpha1/store
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    description: terraform-example
    name: terraform-example-${random_integer.default.result}
    region: cn-beijing
