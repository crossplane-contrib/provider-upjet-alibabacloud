apiVersion: ack.alibabacloud.m.crossplane.io/v1alpha1
kind: Kubernetes
metadata:
  annotations:
    meta.upbound.io/example-id: ack/v1alpha1/kubernetes
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    clusterDomain: cluster.local
    customSan: www.terraform.io
    deletionProtection: false
    enableSsh: false
    imageId: aliyun_4_x64_20G_container_optimized_alibase_20260402.vhd
    installCloudMonitor: true
    masterDiskCategory: cloud_essd
    masterDiskSize: 80
    masterInstanceTypes:
    - ${var.instance_type}
    - ${var.instance_type}
    - ${var.instance_type}
    masterVswitchIdsRefs:
    - name: default
    - name: default
    - name: default
    name: ${var.name}
    newNatGateway: true
    nodeCidrMask: 24
    osType: Linux
    passwordSecretRef:
      key: example-key
      name: example-secret
    platform: AliyunLinux4ContainerOptimized
    podCidr: 10.72.0.0/16
    proxyMode: ipvs
    region: cn-beijing
    resourceGroupId: ${data.alicloud_resource_manager_resource_groups.default.groups.0.id}
    runtime:
    - name: containerd
      version: 1.6.20
    serviceCidr: 172.18.0.0/16
    skipSetCertificateAuthority: false
    slbInternetEnabled: false
    tags:
      Platform: TF
    version: ${data.alicloud_cs_kubernetes_version.default.metadata.2.version}

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: ack/v1alpha1/kubernetes
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    cidrBlock: 192.168.0.0/16
    region: cn-beijing
    vpcName: ${var.name}

---

apiVersion: vpc.alibabacloud.m.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: ack/v1alpha1/kubernetes
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    cidrBlock: 192.168.1.0/24
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: ${var.name}
    zoneId: ${local.zone_id}
