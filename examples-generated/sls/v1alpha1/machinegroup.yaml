apiVersion: sls.alibabacloud.crossplane.io/v1alpha1
kind: MachineGroup
metadata:
  annotations:
    meta.upbound.io/example-id: sls/v1alpha1/machinegroup
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    identifyList:
    - 10.0.0.1
    - 10.0.0.2
    identifyType: ip
    name: terraform-example
    projectSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    region: cn-beijing
    topic: terraform

---

apiVersion: sls.alibabacloud.crossplane.io/v1alpha1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: sls/v1alpha1/machinegroup
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    description: terraform-example
    projectName: terraform-example-${random_integer.default.result}
    region: cn-beijing
