apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: BackupPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/backuppolicy
  labels:
    testing.upbound.io/example-name: policy
  name: policy
spec:
  forProvider:
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: instance
    region: cn-beijing

---

apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/backuppolicy
  labels:
    testing.upbound.io/example-name: instance
  name: instance
spec:
  forProvider:
    engine: MySQL
    engineVersion: "5.6"
    instanceName: ${var.name}
    instanceStorage: "10"
    instanceType: rds.mysql.s1.small
    region: cn-beijing
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/backuppolicy
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    cidrBlock: 172.16.0.0/16
    region: cn-beijing
    vpcName: ${var.name}

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/backuppolicy
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    cidrBlock: 172.16.0.0/24
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: ${var.name}
    zoneId: ${data.alicloud_db_zones.default.zones.0.id}
