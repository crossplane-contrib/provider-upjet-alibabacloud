apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: ReadonlyInstance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readonlyinstance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    engineVersionSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    instanceName: ${var.name}readonly
    instanceStorageSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    instanceTypeSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    masterDbInstanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    region: cn-beijing
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    zoneIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readonlyinstance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    engine: MySQL
    engineVersion: "5.6"
    instanceChargeType: Postpaid
    instanceName: ${var.name}
    instanceStorage: "20"
    instanceType: rds.mysql.t1.small
    region: cn-beijing
    securityIps:
    - 10.168.1.12
    - 100.69.7.112
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: ecs.alibabacloud.crossplane.io/v1alpha1
kind: SecurityGroup
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readonlyinstance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: ${var.name}
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readonlyinstance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    cidrBlock: 172.16.0.0/16
    region: cn-beijing
    vpcName: ${var.name}

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/readonlyinstance
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    cidrBlock: 172.16.0.0/24
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    vswitchName: ${var.name}
    zoneId: ${data.alicloud_db_zones.example.zones.0.id}
