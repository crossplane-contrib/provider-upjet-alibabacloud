apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: Backup
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/backup
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    dbInstanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    region: cn-beijing

---

apiVersion: rds.alibabacloud.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1alpha1/backup
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    dbInstanceStorageType: local_ssd
    engine: MySQL
    engineVersion: "5.6"
    instanceChargeType: Postpaid
    instanceStorage: "30"
    instanceType: rds.mysql.t1.small
    region: cn-beijing
