                    type: string
                  haConfig:
                    description: 'The primary/secondary switchover mode of the instance.
                      Default value: Auto. Valid values:'
                    type: string
                  instanceChargeType:
                    description: Valid values are Prepaid, Postpaid, Serverless, Default
                      to Postpaid. Currently, the resource only supports PostPaid
                      to PrePaid. For more information, see Overview.
                    type: string
                  instanceName:
                    description: The name of DB instance. It a string of 2 to 256
                      characters.
                    type: string
                  instanceStorage:
                    description: 'User-defined DB instance storage space. Value range:'
                    type: number
                  instanceType:
                    description: DB Instance type. For details, see Instance type
                      table.
                    type: string
                  maintainTime:
                    description: 'Maintainable time period format of the instance:
                      HH:MMZ-HH:MMZ (UTC time)'
                    type: string
                  manualHaTime:
                    description: The time after when you want to enable automatic
                      primary/secondary switchover. At most, you can set this parameter
                      to 23:59:59 seven days later. Specify the time in the ISO 8601
                      standard in the yyyy-MM-ddTHH:mm:ssZ format. The time must be
                      in UTC.
                    type: string
                  modifyMode:
                    description: 'The method that is used to modify the IP address
                      whitelist. Default value: Cover. Valid values:'
                    type: string
                  monitoringPeriod:
                    description: The monitoring frequency in seconds. Valid values
                      are 5, 10, 60, 300. Defaults to 300.
                    type: number
                  nodeId:
                    description: The globally unique identifier (GUID) of the secondary
                      instance. You can call the DescribeDBInstanceHAConfig operation
                      to query the GUID of the secondary instance.
                    type: string
                  optimizedWrites:
                    description: 'Write optimization function switch. supported engine
                      type: MySQL. Valid values:'
                    type: string
                  parameters:
                    description: Set of parameters needs to be set after DB instance
                      was launched. Available parameters can refer to the latest docs
                      View database parameter templates . See parameters below.
                    items:
                      properties:
                        name:
                          description: The parameter name.
                          type: string
                        value:
                          description: The parameter value.
                          type: string
                      type: object
                    type: array
                  period:
                    description: |-
                      The duration that you will buy DB instance (in month). It is valid when instance_charge_type is PrePaid. Valid values: [1~9], 12, 24, 36.
                      -> NOTE: The attribute period is only used to create Subscription instance or modify the PayAsYouGo instance to Subscription.
                    type: number
                  pgBouncerEnabled:
                    description: 'Modify the PgBouncer feature of the RDS PostgreSQL
                      instance. Valid values:'
                    type: boolean
                  pgHbaConf:
                    description: The configuration of AD domain . See pg_hba_conf
                      below.
                    items:
                      properties:
                        address:
                          description: The IP addresses from which the specified users
                            can access the specified databases. If you set this parameter
                            to 0.0.0.0/0, the specified users are allowed to access
                            the specified databases from all IP addresses.
                          type: string
                        database:
                          description: The name of the database that the specified
                            users are allowed to access. If you set this parameter
                            to all, the specified users are allowed to access all
                            databases in the instance. If you specify multiple databases,
                            separate the database names with commas (,).
                          type: string
                        mask:
                          description: The mask of the instance. If the value of the
                            Address parameter is an IP address, you can use this parameter
                            to specify the mask of the IP address.
                          type: string
                        method:
                          description: 'The authentication method of Lightweight Directory
                            Access Protocol (LDAP). Valid values: trust, reject, scram-sha-256,
                            md5, password, gss, sspi, ldap, radius, cert, pam.'
                          type: string
                        option:
                          description: Optional. The value of this parameter is based
                            on the value of the HbaItem.N.Method parameter. In this
                            topic, LDAP is used as an example. You must configure
                            this parameter. For more information, see Authentication
                            Methods.
                          type: string
                        priorityId:
                          description: 'The priority of an AD domain. If you set this
                            parameter to 0, the AD domain has the highest priority.
                            Valid values: 0 to 10000. This parameter is used to identify
                            each AD domain. When you add an AD domain, the value of
                            the PriorityId parameter of the new AD domain cannot be
                            the same as the value of the PriorityId parameter for
                            any existing AD domain. When you modify or delete an AD
                            domain, you must also modify or delete the value of the
                            PriorityId parameter for this AD domain.'
                          type: number
                        type:
                          description: 'The type of connection to the instance. Valid
                            values:'
                          type: string
                        user:
                          description: The user that is allowed to access the instance.
                            If you specify multiple users, separate the usernames
                            with commas (,).
                          type: string
                      type: object
                    type: array
                  port:
                    description: The private port of the database service. If you
                      want to update public port, please use resource alicloud_db_connection
                      port.
                    type: string
                  privateIpAddress:
                    description: The private IP address of the instance. The private
                      IP address must be within the Classless Inter-Domain Routing
                      (CIDR) block of the vSwitch that is specified by the VSwitchId
                      parameter.
                    type: string
                  recoveryModel:
                    description: 'Enable the Simple Recovery Model for an RDS SQL
                      Server Instance.The Simple Recovery Model feature is only supported
                      by the Basic Series of RDS SQL Server instances. Once this feature
                      is enabled, it cannot be disabled.Valid values:'
                    type: string
                  region:
                    description: Region is the region you'd like your resource to
                      be created in.
                    type: string
                  releasedKeepPolicy:
                    description: 'The policy based on which ApsaraDB RDS retains archived
                      backup files after the instance is released. Valid values:'
                    type: string
                  replicationAcl:
                    description: 'The method that is used to verify the replication
                      permission. This parameter is supported only when the instance
                      runs PostgreSQL with standard or enhanced SSDs. In addition,
                      this parameter is available only when the public key of the
                      CA that issues client certificates is enabled. Valid values:'
                    type: string
                  resourceGroupId:
                    description: The ID of resource group which the DB instance belongs.
                    type: string
                  roleArn:
                    description: The Alibaba Cloud Resource Name (ARN) of the RAM
                      role.
                    type: string
                  roleArnRef:
                    description: Reference to a Role in ram to populate roleArn.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  roleArnSelector:
                    description: Selector for a Role in ram to populate roleArn.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  securityGroupIdRefs:
                    description: References to SecurityGroup in ecs to populate securityGroupIds.
                    items:
                      description: A Reference to a named object.
                      properties:
                        name:
                          description: Name of the referenced object.
                          type: string
                        policy:
                          description: Policies for referencing.
                          properties:
                            resolution:
                              default: Required
                              description: |-
                                Resolution specifies whether resolution of this reference is required.
                                The default is 'Required', which means the reconcile will fail if the
                                reference cannot be resolved. 'Optional' means this reference will be
                                a no-op if it cannot be resolved.
                              enum:
                              - Required
                              - Optional
                              type: string
                            resolve:
                              description: |-
                                Resolve specifies when this reference should be resolved. The default
                                is 'IfNotPresent', which will attempt to resolve the reference only when
                                the corresponding field is not present. Use 'Always' to resolve the
                                reference on every reconcile.
                              enum:
                              - Always
                              - IfNotPresent
                              type: string
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  securityGroupIdSelector:
                    description: Selector for a list of SecurityGroup in ecs to populate
                      securityGroupIds.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  securityGroupIds:
                    description: ', Available since v1.69.0) The list IDs to join
                      ECS Security Group. At most supports three security groups.'
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  securityIpMode:
                    description: Valid values are normal, safety, Default to normal.
                      support safety switch to high security access mode.
                    type: string
                  securityIpType:
                    description: The type of IP address in the IP address whitelist.
                    type: string
                  securityIps:
                    description: List of IP addresses allowed to access all databases
                      of an instance. The list contains up to 1,000 IP addresses,
                      separated by commas. Supported formats include 0.0.0.0/0, 10.23.12.24
                      (IP), and 10.23.12.24/24 (Classless Inter-Domain Routing (CIDR)
                      mode. /24 represents the length of the prefix in an IP address.
                      The range of the prefix length is [1,32]).
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  serverCertSecretRef:
                    description: 'The content of the server certificate. This parameter
                      is supported only when the instance runs PostgreSQL or MySQL
                      with standard or enhanced SSDs. If you set the CAType parameter
                      to custom, you must also specify this parameter. NOTE: From
                      version 1.231.0, server_cert start  support MySQL engine.'
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  serverKey:
                    description: 'The private key of the server certificate. This
                      parameter is supported only when the instance runs PostgreSQL
                      or MySQL with standard or enhanced SSDs. If you set the CAType
                      parameter to custom, you must also specify this parameter. NOTE:
                      From version 1.231.0, server_key start support MySQL engine.'
                    type: string
                  serverlessConfig:
                    description: The settings of the serverless instance. This parameter
                      is required when you create a serverless instance. This parameter
                      takes effect only when you create an ApsaraDB RDS for Serverless
                      instance. See serverless_config below.
                    items:
                      properties:
                        autoPause:
                          description: 'Specifies whether to enable the smart startup
                            and stop feature for the serverless instance. Valid values:'
                          type: boolean
                        maxCapacity:
                          description: 'The maximum number of RDS Capacity Units (RCUs).
                            The value of this parameter must be greater than or equal
                            to min_capacity and only supports passing integers. Valid
                            values:'
                          type: number
                        minCapacity:
                          description: 'The minimum number of RCUs. The value of this
                            parameter must be less than or equal to max_capacity.
                            Valid values:'
                          type: number
                        switchForce:
                          description: 'Specifies whether to enable the forced scaling
                            feature for the serverless instance. Valid values:'
                          type: boolean
                      type: object
                    type: array
                  sqlCollectorConfigValue:
                    description: |-
                      The sql collector keep time of the instance. Valid values are 30, 180, 365, 1095, 1825, Default to 30.
                      -> NOTE: This parameter takes effect when sql_collector_status is set to Enabled and does not take effect when sql_collector_status is set to Disabled.
                    type: number
                  sqlCollectorStatus:
                    description: The sql collector status of the instance. Valid values
                      are Enabled, Disabled, Default to Disabled.
                    type: string
                  sslAction:
                    description: |-
                      Actions performed on SSL functions. Valid values:
                      Open: turn on SSL encryption;
                      Close: turn off SSL encryption;
                      Update: update SSL certificate.
                      See more engine and engineVersion limitation.
                    type: string
                  sslCertificateSecretRef:
                    description: The custom certificate.
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  sslConnectionString:
