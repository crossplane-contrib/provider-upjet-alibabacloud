                      The threshold in percentage based on which an automatic storage expansion is triggered. If the available storage reaches the threshold, ApsaraDB RDS increases the storage capacity of the instance.
                      Valid values: [10, 20, 30, 40, 50].
                    type: number
                  storageUpperBound:
                    description: 'The upper limit of the total storage space for automatic
                      expansion of the storage space, that is, automatic expansion
                      will not cause the total storage space of the instance to exceed
                      this value. Unit: GB. The value must be ≥0.'
                    type: number
                  switchTime:
                    description: The specific point in time when you want to perform
                      the update. Specify the time in the ISO 8601 standard in the
                      yyyy-MM-ddTHH:mm:ssZ format. It is valid only when target_minor_version
                      is changed. The time must be in UTC.
                    type: string
                  tags:
                    additionalProperties:
                      type: string
                    description: Key-value map of resource tags.
                    type: object
                    x-kubernetes-map-type: granular
                  targetMinorVersion:
                    description: 'The minor engine version to which you want to update
                      the instance. If you do not specify this parameter, the instance
                      is updated to the latest minor engine version. You must specify
                      the minor engine version in one of the following formats:'
                    type: string
                  tcpConnectionType:
                    description: 'The availability check method of the instance. Valid
                      values:'
                    type: string
                  tdeCertificateSecretRef:
                    description: The file that contains the certificate..
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
