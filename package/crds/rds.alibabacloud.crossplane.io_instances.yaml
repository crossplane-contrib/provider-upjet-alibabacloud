                    type: string
                  sslPasswordSecretRef:
                    description: The password of the certificate.
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  storageAutoScale:
                    description: 'Automatic storage space expansion switch. Valid
                      values:'
                    type: string
                  storageThreshold:
