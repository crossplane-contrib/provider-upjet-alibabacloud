                    type: string
                  dbIsIgnoreCase:
                    description: 'Specifies whether table names on the instance are
                      case-sensitive. Valid values: true, false.'
                    type: boolean
                  dbParamGroupId:
                    description: Parameter template ID. Only MySQL and PostgreSQL
                      support this parameter. If this parameter is not specified,
                      the default parameter template is used. You can also customize
                      a parameter template and use it here.
                    type: string
                  dbTimeZone:
                    description: The time zone of the instance. This parameter takes
                      effect only when you set the Engine parameter to MySQL or PostgreSQL.
                    type: string
                  deletionProtection:
                    description: 'The switch of delete protection. Valid values:'
                    type: boolean
                  direction:
                    description: 'The instance configuration type. Valid values: ["Up",
                      "Down", "TempUpgrade", "Serverless"]'
                    type: string
                  effectiveTime:
                    description: 'The method to update the engine version and change.  Default
                      value: Immediate. Valid values:'
                    type: string
                  encryptionKey:
                    description: |-
                      The key id of the KMS. Used for encrypting a disk if not null. Only for PostgreSQL, MySQL and SQLServer.
                      When the instance is PostgreSQL, this parameter can be used to enable, modify, and disable cloud disk encryption.Value range:
                    type: string
                  engine:
                    description: 'Database type. Value options: MySQL, SQLServer,
                      PostgreSQL, MariaDB.'
                    type: string
                  engineVersion:
                    description: Database version. Value options can refer to the
                      latest docs CreateDBInstance EngineVersion.
                    type: string
                  force:
                    description: 'Specifies whether to enable forcible switching.
                      Valid values:'
                    type: string
                  forceEncryption:
                    description: 'Specifies whether to enable the forceful SSL encryption
                      feature. This parameter is supported only for ApsaraDB RDS for
                      SQL Server instances.Valid values:'
                    type: number
                  forceRestart:
                    description: Set it to true to make some parameter efficient when
                      modifying them. Default to false.
                    type: boolean
                  freshWhiteListReadins:
                    description: The read-only instances to which you want to synchronize
