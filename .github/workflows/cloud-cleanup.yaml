# Lists, and on request deletes, Alibaba Cloud resources that end-to-end test
# runs left behind in the test account, using the same credentials as uptest.
# See hack/cloud-cleanup.sh for the target format.
name: Cloud Cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inventory lists what exists (read-only); delete removes the targets below"
        type: choice
        options:
          - inventory
          - delete
        default: inventory
      regions:
        description: "inventory: comma-separated regions"
        type: string
        default: us-west-1,cn-beijing,cn-hangzhou
      targets:
        description: 'delete: comma-separated "<region> <id>" or "<region> <type>:<name>" (types: ackone, kafka, sls, mns, fc, oss, cms, ram), e.g. "us-west-1 vpc-abc, cn-beijing ackone:c123"'
        type: string
        default: ""
      confirm:
        description: 'delete: type "delete" to confirm'
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cloud-cleanup
  cancel-in-progress: false

env:
  ALIYUN_CLI_VERSION: "3.5.2"
  ALIYUN_CLI_SHA256: 8058cb91fa0e2d46a7c5fd47e44ab6a465be8477b28595d408dcc03a0ed5bd4e

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Inputs
        if: inputs.mode == 'delete'
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGETS: ${{ inputs.targets }}
        run: |
          if [ "${CONFIRM}" != "delete" ]; then
            echo "::error::delete mode needs confirm set to \"delete\""
            exit 1
          fi
          if [ -z "${TARGETS//[[:space:],]/}" ]; then
            echo "::error::delete mode needs at least one target"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Alibaba Cloud CLI
        run: |
          curl -fsSL -o aliyun.tgz "https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz"
          echo "${ALIYUN_CLI_SHA256}  aliyun.tgz" | sha256sum -c -
          tar -xzf aliyun.tgz aliyun
          sudo install -m 0755 aliyun /usr/local/bin/aliyun
          rm aliyun aliyun.tgz
          aliyun version

      - name: Configure Credentials
        env:
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
        run: |
          ak=$(jq -r '.access_key // empty' <<<"${UPTEST_CLOUD_CREDENTIALS}")
          sk=$(jq -r '.secret_key // empty' <<<"${UPTEST_CLOUD_CREDENTIALS}")
          if [ -z "${ak}" ] || [ -z "${sk}" ]; then
            echo "::error::UPTEST_CLOUD_CREDENTIALS has no access_key and secret_key"
            exit 1
          fi
          echo "::add-mask::${ak}"
          echo "::add-mask::${sk}"
          aliyun configure set --profile default --mode AK \
            --access-key-id "${ak}" --access-key-secret "${sk}" --region us-west-1 >/dev/null

      - name: Inventory
        if: inputs.mode == 'inventory'
        env:
          REGIONS: ${{ inputs.regions }}
        run: |
          IFS=', ' read -r -a regions <<<"${REGIONS}"
          hack/cloud-cleanup.sh inventory "${regions[@]}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload Raw Inventory
        if: inputs.mode == 'inventory'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloud-inventory
          path: _output/cloud-cleanup
          if-no-files-found: ignore

      - name: Delete
        if: inputs.mode == 'delete'
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          tr ',' '\n' <<<"${TARGETS}" >targets.txt
          set -o pipefail
          hack/cloud-cleanup.sh delete targets.txt | tee -a "${GITHUB_STEP_SUMMARY}"
